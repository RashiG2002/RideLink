# 1. Set the service name shown in Spring application metadata.
spring.application.name=fare-payment-service
# 2. Run the embedded web server on port 8088.
server.port=8088

# 3. Connect to MongoDB. Use MONGODB_URI when provided; otherwise use the local development database.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_payment_db}

# 4. Expose the generated OpenAPI specification at this path.
springdoc.api-docs.path=/v3/api-docs
# 5. Serve the Swagger UI at this path.
springdoc.swagger-ui.path=/swagger-ui.html